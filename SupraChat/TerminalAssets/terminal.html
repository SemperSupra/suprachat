<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace terminal</title>
<style>
/* XTERM_CSS */
html, body { height: 100%; margin: 0; background: #171717; overflow: hidden; }
#terminal { position: absolute; inset: 5px; }
</style>
</head>
<body>
<div id="terminal" aria-label="Interactive workspace terminal"></div>
<script>/* XTERM_JS */</script>
<script>/* FIT_JS */</script>
<script>
"use strict";
window.initializeTerminal = (token) => {
    const send = (kind, fields = {}) => invokeCSharpAction(JSON.stringify({ token, kind, ...fields }));
    const element = document.getElementById("terminal");
    const terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "Consolas, monospace",
        scrollback: 3000,
        screenReaderMode: true,
        theme: { background: "#171717", foreground: "#eeeeee" },
        linkHandler: { activate: () => {} }
    });
    const fit = new FitAddon.FitAddon();
    terminal.loadAddon(fit);
    terminal.open(element);
    terminal.onData((text) => {
        if (text.length <= 16384) send("input", { text });
    });
    terminal.onResize(({ cols, rows }) => send("resize", { cols, rows }));
    new ResizeObserver(() => fit.fit()).observe(element);
    fit.fit();
    window.writeTerminal = (text) => terminal.write(text);
    window.resetTerminal = () => terminal.reset();
    window.focusTerminal = () => terminal.focus();
    window.stageTerminalSelection = () => send("selection", { text: terminal.getSelection().slice(0, 16385) });
    send("ready", { cols: terminal.cols, rows: terminal.rows });
};
</script>
</body>
</html>
