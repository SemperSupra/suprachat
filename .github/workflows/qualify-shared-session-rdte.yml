name: Qualify shared multi-session local RDTE
on:
  pull_request:
    paths:
      - 'SupraChat.SessionCore/**'
      - 'SupraChat.SessionHost/**'
      - 'SupraChat/MainWindow.SharedSessions.cs'
      - 'SupraChat/MainWindow.axaml'
      - 'SupraChat/SupraChat.csproj'
      - 'tools/qualify-shared-session-host.py'
      - '.github/workflows/qualify-shared-session-rdte.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-multi-process:
    name: Shared session multi-process ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build transport-independent shared session kernel and headless host
        run: dotnet build SupraChat.SessionHost/SupraChat.SessionHost.csproj -c Release
      - name: Compile accessible human shared-session participant UI
        run: dotnet build SupraChat/SupraChat.csproj -c Release
      - name: Require labeled and accessible shared session controls
        shell: pwsh
        run: |
          $ui = Get-Content -Raw 'SupraChat/MainWindow.axaml'
          foreach ($id in @('Sessions.SharedHeading','Sessions.SharedPipe','Sessions.SharedRefresh','Sessions.SharedCreate','Sessions.SharedList','Sessions.SharedJoin','Sessions.SharedAppend','Sessions.SharedEvents','Sessions.SharedStatus')) {
            if ($ui -notmatch [regex]::Escape($id)) { throw "Shared UI accessibility ID missing: $id" }
          }
          $source = Get-Content -Raw 'SupraChat/MainWindow.SharedSessions.cs'
          $source = [regex]::Replace($source, '(?m)^\s*//.*
        run: python tools/qualify-shared-session-host.py SupraChat.SessionHost/bin/Release/net10.0/SupraChat.SessionHost.dll
, '')
          if ($source -match '(?i)\bHttpClient\b|\bProcess\.Start\b|\bClipboard\b|\bWebSocket\b') {
            throw 'Unexpected provider/process/network authority in synthetic human projection'
          }
          Write-Host 'Shared human UI semantic IDs and no-provider guard PASS'
      - name: Compile real automation and agent JSON-RPC projection
        run: dotnet build SupraChat.Automation/SupraChat.Automation.csproj -c Release
      - name: Run independent-process, GUI-core and agent JSON-RPC shared-session qualification
        run: python tools/qualify-shared-session-host.py SupraChat.SessionHost/bin/Release/net10.0/SupraChat.SessionHost.dll SupraChat.Automation/bin/Release/net10.0/SupraChat.Automation.dll
