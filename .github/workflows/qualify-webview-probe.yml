name: Qualify synthetic native WebView probe
on:
  pull_request:
    paths:
      - 'SupraChat.WebViewProbe/**'
      - 'SupraChat.WebViewOracle/**'
      - 'tools/local/Test-SupraChatWebViewProbe.ps1'
      - 'tools/local/Compare-SupraChatWebViewOracle.ps1'
      - '.github/workflows/qualify-webview-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-synthetic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated probe
        run: dotnet build SupraChat.WebViewProbe/SupraChat.WebViewProbe.csproj -c Release
      - name: Qualify two disposable native browsers against synthetic loopback fixtures
        shell: pwsh
        run: |
          ./tools/local/Test-SupraChatWebViewProbe.ps1 -ReceiptPath "$env:RUNNER_TEMP/webview-probe-receipt.json"
      - name: Preserve sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-webview-probe-receipt
          path: ${{ runner.temp }}/webview-probe-receipt.json
          if-no-files-found: ignore
      - name: Build independent browser oracles
        run: dotnet build SupraChat.WebViewOracle/SupraChat.WebViewOracle.csproj -c Release
      - name: Install pinned isolated Chromium oracle
        shell: pwsh
        run: ./SupraChat.WebViewOracle/bin/Release/net10.0-windows/playwright.ps1 install chromium --only-shell
      - name: Compare independent Chromium and Microsoft-only native host
        shell: pwsh
        run: ./tools/local/Compare-SupraChatWebViewOracle.ps1 -OutputDirectory "$env:RUNNER_TEMP/independent-browser-oracles"
      - name: Preserve sanitized independent oracle receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-browser-oracle-receipts
          path: ${{ runner.temp }}/independent-browser-oracles/*.json
          if-no-files-found: ignore
