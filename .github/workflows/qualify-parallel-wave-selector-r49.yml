name: R49 Deterministic Independent Wave Selector
on:
  pull_request:
    paths:
      - 'tools/parallel-wave-selector/**'
      - '.github/workflows/qualify-parallel-wave-selector-r49.yml'
permissions:
  contents: read
jobs:
  pure-wave-selector:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    defaults:
      run:
        working-directory: tools/parallel-wave-selector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache: false
      - name: Vet and exercise deterministic antichain choice
        run: |
          go vet ./...
          go test -count=4 -shuffle=on -timeout=4m ./...
      - name: Race detector on free Linux
        if: runner.os == 'Linux'
        run: go test -race -count=2 -timeout=4m ./...
