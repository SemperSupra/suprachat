name: RDTE stable bootstrap - native Windows PowerShell 5.1

on:
  pull_request:
    paths:
      - 'tools/rdte-bootstrap/**'
      - '.github/workflows/rdte-bootstrap-ps51.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-native-ps51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native Windows PowerShell 5.1 test suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Runner is not Windows PowerShell Desktop 5.1.'
          }
          $driver = Join-Path $env:GITHUB_WORKSPACE 'tools\rdte-bootstrap\Start-SupraChat-RDTE.ps1'
          $test = Join-Path $env:GITHUB_WORKSPACE 'tools\rdte-bootstrap\Test-Start-SupraChat-RDTE.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $driver -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Actual CLI selftest failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test
          if ($LASTEXITCODE -ne 0) { throw 'Actual native contract tests failed.' }
      - name: Fail on private-data or host-global operations
        shell: powershell
        run: |
          $source = Get-Content 'tools/rdte-bootstrap/Start-SupraChat-RDTE.ps1' -Raw
          if ($source -match '(?i)(repos/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+|Set-ExecutionPolicy|Set-ItemProperty|Set-EnvironmentVariable|Start-Process\s+.*-Verb\s+RunAs|gh\s+auth\s+login|docker\s+run|git\s+reset)') {
            throw 'Unexpected global host change command in bootstrap.'
          }
          Write-Output 'No global install, privileged host change, or Git reset patterns.'
