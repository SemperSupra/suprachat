name: R48 Batch DAG and Authority Critic (Public Free)
on:
  pull_request:
    paths:
      - 'tools/qualification/validate_parallel_workset.py'
      - 'tools/qualification/test_parallel_workset.py'
      - 'tools/qualification/fixtures/**'
      - '.github/workflows/qualify-parallel-workset-r48.yml'
permissions:
  contents: read
jobs:
  parallel-workset-critic:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate disjoint runnable lanes, held dependencies and adversarial controls
        run: |
          python -m tools.qualification.test_parallel_workset
          python -m tools.qualification.validate_parallel_workset tools/qualification/fixtures/parallel_workset_synthetic.json
