name: R50 Redacted Windows UIA Startup Failure Receipt
on:
  pull_request:
    paths:
      - 'tools/uia-lifetime-diagnostics/**'
      - '.github/workflows/qualify-uia-lifetime-r50.yml'
      - '.github/workflows/qualify-suprachat.yml'
permissions:
  contents: read
jobs:
  privacy-receipt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic redacted startup logs and negative privacy tests
        shell: pwsh
        run: ./tools/uia-lifetime-diagnostics/tests/Test-RedactedUiaFailureReceipt.ps1
  ps51-privacy:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 privacy negative tests
        shell: powershell
        run: .\tools\uia-lifetime-diagnostics\tests\Test-RedactedUiaFailureReceipt.ps1
