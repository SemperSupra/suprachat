name: Public container execution census
on:
  pull_request:
    paths:
      - 'tools/public-container-browser-smoke.mjs'
      - 'tools/public-browser-container.Dockerfile'
      - 'tools/inspect-windows-container-host.ps1'
      - '.github/workflows/verify-container-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-docker-browser:
    name: Linux Docker 3-engine public-safe browser rep
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runner Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'daemon_os={{.OSType}} daemon_arch={{.Architecture}}'
          test "$(docker info --format '{{.OSType}}')" = linux
          docker --version
      - name: Linux OCI host read-only capability census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suprachat-container"
          bash tools/inspect-linux-container-host.sh | tee "$RUNNER_TEMP/suprachat-container/host.json"
          jq -e '.daemon_reachable == true and .daemon_os == "linux" and .heavyweight_execution_admitted == false' "$RUNNER_TEMP/suprachat-container/host.json" >/dev/null
      - name: Build public-safe Playwright Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f tools/public-browser-container.Dockerfile -t suprachat-public-browser-probe:ci .
          docker image inspect suprachat-public-browser-probe:ci --format 'image={{.Id}} os={{.Os}} arch={{.Architecture}}'
      - name: Execute three browsers offline inside Linux OCI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suprachat-container"
          docker run --rm --init --network none --ipc host --security-opt no-new-privileges \
            --cap-drop ALL --read-only --tmpfs /tmp:rw,mode=1777,size=2g \
            suprachat-public-browser-probe:ci | tee "$RUNNER_TEMP/suprachat-container/receipt.json"
          jq -e '.private_source_used == false and .touched_real_chatgpt == false and
            ([.results[] | select(.status == "PASS")] | length) == 3' \
            "$RUNNER_TEMP/suprachat-container/receipt.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-linux-container-browser-receipt
          path: ${{ runner.temp }}/suprachat-container/*.json
          if-no-files-found: warn
          retention-days: 7

  windows-container-census:
    name: Windows hosted runner native Hyper-V WSL Docker census
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows read-only capability collector
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/inspect-windows-container-host.ps1).Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw 'Windows collector syntax invalid' }
          & tools/inspect-windows-container-host.ps1 -Output "$env:RUNNER_TEMP\suprachat-windows-container.json"
          $receipt = Get-Content -Raw "$env:RUNNER_TEMP\suprachat-windows-container.json" | ConvertFrom-Json
          if ($receipt.schema -ne 'suprachat-windows-container-host-census/v1' -or
            -not $receipt.window_os -or $receipt.authorization_to_install_or_enable) {
            throw 'Read-only container census invariant failure'
          }
      - name: Launch pinned Windows Nano Server container on hosted Windows daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $daemon = (& docker info --format '{{.OSType}}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $daemon -ne 'windows') {
            throw 'This hosted runner does not expose a Windows Docker daemon'
          }
          $observed = & docker run --rm --isolation=process mcr.microsoft.com/windows/nanoserver:ltsc2025 cmd.exe /c echo SUPRACHAT_WINDOWS_CONTAINER_OK
          if ($LASTEXITCODE -ne 0 -or -not (($observed | Out-String) -match 'SUPRACHAT_WINDOWS_CONTAINER_OK')) {
            throw 'Actual Windows Nano Server container execution failed'
          }
          Write-Host 'Windows OCI Nano Server ltsc2025 execution PASS; canonical browser image still Linux-only'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-windows-container-census
          path: ${{ runner.temp }}\suprachat-windows-container.json
          if-no-files-found: warn
          retention-days: 7
