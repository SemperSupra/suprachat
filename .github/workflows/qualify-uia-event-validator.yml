name: Qualify fixed-schema UIA event receipts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uia-event-validator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  event-receipt-validator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Synthetic fixed-schema and contradiction refusal checks
        shell: pwsh
        run: ./tools/local/Test-UiaEventReceipt.ps1 -SelfTest
