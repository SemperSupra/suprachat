name: Qualify synthetic native UIA secret peer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-synthetic-secret-uia:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build real production secure peer in disposable native fixture
        shell: pwsh
        run: dotnet build SupraChat.UiaSecurityProbe/SupraChat.UiaSecurityProbe.csproj -c Release
      - name: Build native UIA observer
        shell: pwsh
        run: dotnet build SupraChat.UiaComObserver/SupraChat.UiaComObserver.csproj -c Release
      - name: Verify filled in-memory synthetic secret against independent native UIA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/local/Test-SupraChatSecretUiaProbe.ps1 -Executable (Join-Path $PWD 'SupraChat.UiaSecurityProbe/bin/Release/net10.0-windows/SupraChat.UiaSecurityProbe.exe') -ObserverExecutable (Join-Path $PWD 'SupraChat.UiaComObserver/bin/Release/net10.0-windows/SupraChat.UiaComObserver.exe')
      # Intentionally no raw UIA trees, screenshots, traces, app profiles, secret
      # state files, test process dumps or artifact uploads from this job.
