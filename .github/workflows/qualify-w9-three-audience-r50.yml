name: R50 W9 Same-Session Three-Audience Durable CAS
on:
  pull_request:
    paths:
      - 'tools/qualify-w9-durable-w6-host.mjs'
      - '.github/workflows/qualify-w9-three-audience-r50.yml'
permissions:
  contents: read
jobs:
  shared-session:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build actual disposable W9 session host
        run: dotnet build SupraChat.Automation/SupraChat.Automation.csproj -c Release
      - name: Concurrent human automation agent on ONE durable synthetic session
        run: node tools/qualify-w9-durable-w6-host.mjs
