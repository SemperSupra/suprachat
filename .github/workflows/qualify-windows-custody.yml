name: Qualify Windows owner custody research
on:
  pull_request:
    paths:
      - 'SupraChat.PeerLedgerRdte/**'
      - '.github/workflows/qualify-windows-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-custody:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Qualify protected issuer and checkpoint fixtures
        shell: pwsh
        run: |
          dotnet run --project SupraChat.PeerLedgerRdte -c Release -- --custody-receipt "$env:RUNNER_TEMP/windows-custody-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows custody fixture failed.' }
          $json = [IO.File]::ReadAllText("$env:RUNNER_TEMP/windows-custody-receipt.json")
          foreach ($forbidden in @('synthetic-peer-ledger-private-sentinel', 'Bearer ', 'http://', 'https://', 'S-1-5-', $env:COMPUTERNAME)) {
            if ($json.Contains($forbidden)) { throw 'Receipt privacy oracle failed.' }
          }
          $receipt = $json | ConvertFrom-Json
          if (!$receipt.passed -or $receipt.schema -ne 'suprachat-windows-custody-rdte/v1' -or !$receipt.windows_custody_mode -or
              $receipt.cases.Count -ne 17 -or $receipt.custody_checks.Count -ne 15 -or $receipt.failure -ne 'NONE' -or
              $receipt.custody_phase -ne 'restricted-token-directory-create-denied' -or
              $receipt.key_protection -ne 'WINDOWS_DPAPI_CURRENT_USER_SYNTHETIC' -or
              @($receipt.cases | Where-Object { !$_.passed }).Count -ne 0 -or
              @($receipt.custody_checks | Where-Object { !$_.passed }).Count -ne 0 -or
              $receipt.production_issuer_custody_qualified -or $receipt.different_user_denial_qualified -or
              $receipt.general_path_race_resistance_qualified -or $receipt.owner_admin_resistance_qualified -or
              $receipt.human_identity_qualified -or $receipt.shared_provider_control_qualified -or $receipt.first_party_capture -or
              $receipt.grants_exported -or $receipt.signing_key_exported -or $receipt.peer_identity_values_exported) {
            throw 'Windows custody receipt scope failed.'
          }
      - name: Preserve sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-windows-custody-receipt
          path: ${{ runner.temp }}/windows-custody-receipt.json
          if-no-files-found: ignore
