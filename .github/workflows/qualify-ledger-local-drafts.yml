name: Qualify ledger-bound local draft staging
on:
  pull_request:
  workflow_dispatch:
# Superseded revisions of one PR must not fan out costly cross-platform
# runs. Manual workflow_dispatch reps remain independently observable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  ledger-drafts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify one-use draft and ledger version fences
        run: dotnet run --project SupraChat.LedgerDraftTests/SupraChat.LedgerDraftTests.csproj -c Release
