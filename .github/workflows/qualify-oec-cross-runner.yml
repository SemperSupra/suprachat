name: Qualify OEC Cross-Runner Ephemeral Rendezvous
on:
  pull_request:
    paths:
      - 'tools/oec-rendezvous/**'
      - '.github/workflows/qualify-oec-cross-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oec-cross-runner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Independent server runner (Cloudflare HTTPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/ephemeral-tunnel-lab/go.mod
          cache: false
      - name: Start fixed MCP server, publish encrypted handoff
        shell: bash
        run: bash ./tools/oec-rendezvous/server-start.sh
      - name: Publish only public endpoint and RSA-OAEP ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: oec-server-rendezvous
          path: ${{ runner.temp }}/oec-server/public/
          retention-days: 1
      - name: Await independent client receipt via authenticated GitHub artifacts
        shell: bash
        run: bash ./tools/oec-rendezvous/server-finish.sh
      - name: Shut down tunnel and destroy runner credentials
        if: always()
        shell: bash
        run: bash ./tools/oec-rendezvous/server-stop.sh
  client:
    name: Independent client runner (private RSA key)
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral keypair on separate runner
        shell: bash
        run: bash ./tools/oec-rendezvous/client-init.sh
      - name: Publish only the public key
        uses: actions/upload-artifact@v4
        with:
          name: oec-client-public
          path: ${{ runner.temp }}/oec-client/public/client.pem
          retention-days: 1
      - name: Decrypt private handoff and qualify HTTPS MCP externally
        shell: bash
        run: bash ./tools/oec-rendezvous/client-run.sh
      - name: Publish independently verified redacted receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oec-client-verified
          path: ${{ runner.temp }}/oec-client/receipt/client-receipt.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Dispose private key and token
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/oec-client"
