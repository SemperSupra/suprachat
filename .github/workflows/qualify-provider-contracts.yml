name: Qualify synthetic provider contracts
on:
  pull_request:
    paths:
      - 'SupraChat.ProviderContracts/**'
      - 'SupraChat.ProviderContractTests/**'
      - '.github/workflows/qualify-provider-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Qualify no-network provider contracts
        run: dotnet run --project SupraChat.ProviderContractTests/SupraChat.ProviderContractTests.csproj -c Release
