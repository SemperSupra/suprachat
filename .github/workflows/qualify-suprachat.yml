name: Qualify SupraChat

on:
  push:
    branches:
      - 'migration/extracted-qualified-20261002'
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            artifact: suprachat-windows-x64
            codex_asset: codex-x86_64-pc-windows-msvc.exe
            codex_sha256: 57e1bdab42c0559a74558ca17e85d5c7893caa5f1e582f67e9ddd6d97fa705a7
            codex_archive: false
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: suprachat-linux-x64
            codex_asset: codex-x86_64-unknown-linux-musl.tar.gz
            codex_sha256: b48ca1b2d6b1bf42b944e02c3d937c898e24651916684cdc35fdedf31b291bcb
            codex_archive: true
          - os: macos-26
            rid: osx-arm64
            artifact: suprachat-macos-arm64
            codex_asset: codex-aarch64-apple-darwin.tar.gz
            codex_sha256: 51de50a39ea592b5b0a64ae0474548c282181cb6b96d9bd08965a682ae12774c
            codex_archive: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CODEX_TAG: rust-v0.159.3
      CODEX_VERSION: 0.159.3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build application
        run: dotnet build SupraChat/SupraChat.csproj -c Release

      - name: Run contract checks
        run: dotnet run --project SupraChat.ContractTests/SupraChat.ContractTests.csproj -c Release

      - name: Build automation and agent shell
        run: dotnet build SupraChat.Automation/SupraChat.Automation.csproj -c Release

      - name: Smoke automation JSON surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- capabilities
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation capabilities failed.' }
          $doc = $json | ConvertFrom-Json
          if (-not $doc.ok) { throw 'Automation capabilities response was not ok.' }
          if (-not $doc.value.audiences.automation.supported) { throw 'Automation audience not advertised.' }
          if (-not $doc.value.audiences.agent.supported) { throw 'Agent audience not advertised.' }

          $accessibility = dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- accessibility
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation accessibility failed.' }
          $accessDoc = $accessibility | ConvertFrom-Json
          if (-not $accessDoc.ok) { throw 'Accessibility response was not ok.' }
          if (-not $accessDoc.value.human.keyboard_only) { throw 'Keyboard-only accessibility contract missing.' }
          if (-not $accessDoc.value.human.screen_reader_semantics) { throw 'Screen-reader semantic contract missing.' }
          if ($accessDoc.value.automation.screen_scraping_required) { throw 'Automation accessibility regressed to screen scraping.' }
          if ($accessDoc.value.agent.screen_scraping_required) { throw 'Agent accessibility regressed to screen scraping.' }

          $catalog = dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- catalog
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation catalog failed.' }
          $catalogDoc = $catalog | ConvertFrom-Json
          if (-not $catalogDoc.ok) { throw 'Catalog response was not ok.' }
          if ($catalogDoc.value.codex.packaged_runtime.counts.total -ne 263) { throw 'Packaged Codex catalog count drifted.' }
          if ($catalogDoc.value.codex.upstream_frontier.counts.total -ne 266) { throw 'Codex frontier catalog count drifted.' }

          $diagnostics = dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation diagnostics failed.' }
          $diagnosticsDoc = $diagnostics | ConvertFrom-Json
          if (-not $diagnosticsDoc.ok -or $diagnosticsDoc.value.schema -ne 'suprachat-dogfood-observability/v2') {
            throw 'Dogfood diagnostics descriptor contract failed.'
          }
          if ($diagnosticsDoc.value.trace_id.Length -ne 32 -or
              $diagnosticsDoc.value.contains_prompts -or
              $diagnosticsDoc.value.contains_outputs -or
              $diagnosticsDoc.value.contains_token_material) {
            throw 'Dogfood diagnostics trace/privacy contract failed.'
          }

          $diagZip = Join-Path $env:RUNNER_TEMP "suprachat-diagnostics-${{ matrix.rid }}.zip"
          $diagExport = dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- diagnostics-export --output $diagZip
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $diagZip)) {
            throw 'Dogfood diagnostics export failed.'
          }
          $diagExportDoc = $diagExport | ConvertFrom-Json
          if (-not $diagExportDoc.ok -or $diagExportDoc.value.schema -ne 'suprachat-dogfood-diagnostics-export/v2') {
            throw 'Dogfood diagnostics export contract failed.'
          }

      - name: Smoke agent JSON-RPC stdio surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = '{"jsonrpc":"2.0","id":1,"method":"capabilities/read"}'
          $lines = $request | dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation stdio failed.' }
          $response = ($lines | Select-Object -Last 1) | ConvertFrom-Json
          if ($response.jsonrpc -ne '2.0') { throw 'JSON-RPC version mismatch.' }
          if ($response.id -ne 1) { throw 'JSON-RPC id mismatch.' }
          if (-not $response.result.audiences.agent.supported) { throw 'Agent JSON-RPC capability missing.' }

          $accessRequest = '{"jsonrpc":"2.0","id":2,"method":"accessibility/read"}'
          $accessLines = $accessRequest | dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat accessibility/read stdio failed.' }
          $accessResponse = ($accessLines | Select-Object -Last 1) | ConvertFrom-Json
          if ($accessResponse.id -ne 2 -or -not $accessResponse.result.human.screen_reader_semantics) {
            throw 'Agent accessibility contract missing.'
          }

          $diagRequest = '{"jsonrpc":"2.0","id":3,"method":"diagnostics/read"}'
          $diagLines = $diagRequest | dotnet run --project SupraChat.Automation/SupraChat.Automation.csproj -c Release -- stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat diagnostics/read stdio failed.' }
          $diagResponse = ($diagLines | Select-Object -Last 1) | ConvertFrom-Json
          if ($diagResponse.id -ne 3 -or
              $diagResponse.result.schema -ne 'suprachat-dogfood-observability/v2' -or
              $diagResponse.result.trace_id.Length -ne 32) {
            throw 'Agent diagnostics correlation contract missing.'
          }

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out/${{ matrix.rid }}'
          if ($IsMacOS) {
            $singleFile = @(
              '-p:PublishSingleFile=true',
              '-p:IncludeNativeLibrariesForSelfExtract=true',
              '-p:EnableCompressionInSingleFile=true'
            )
            dotnet publish SupraChat/SupraChat.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out @singleFile
            dotnet publish SupraChat.Automation/SupraChat.Automation.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out @singleFile

            # Single-file publish embeds Microsoft.Playwright.dll but does not
            # reliably carry the complete bundled Node/CLI driver tree. The
            # .NET runtime still requires that tree beside the executable.
            $nugetDriverRoot = Join-Path $HOME '.nuget/packages/microsoft.playwright/1.63.0/.playwright'
            $nugetDriverCli = Join-Path $nugetDriverRoot 'package/cli.js'
            $nugetDriverNode = Join-Path $nugetDriverRoot 'node/darwin-arm64/node'

            if ((Test-Path $nugetDriverCli) -and (Test-Path $nugetDriverNode)) {
              $driverSourcePath = $nugetDriverRoot
            } else {
              # Fallback for a non-default NuGet cache. Require both the JS
              # package and the exact target-platform node payload.
              $driverSource = Get-ChildItem (Join-Path $PWD 'prototype/suprachat') -Force -Directory -Filter '.playwright' -Recurse -ErrorAction SilentlyContinue |
                Where-Object {
                  (Test-Path (Join-Path $_.FullName 'package/cli.js')) -and
                  (Test-Path (Join-Path $_.FullName 'node/darwin-arm64/node'))
                } |
                Select-Object -First 1
              if (-not $driverSource) {
                throw 'Complete Playwright macOS arm64 driver tree was not found in NuGet cache or build outputs.'
              }
              $driverSourcePath = $driverSource.FullName
            }

            $publishedDriverRoot = Join-Path $out '.playwright'
            if (Test-Path $publishedDriverRoot) {
              Remove-Item $publishedDriverRoot -Recurse -Force
            }
            Copy-Item $driverSourcePath $publishedDriverRoot -Recurse -Force

            $driverCli = Join-Path $publishedDriverRoot 'package/cli.js'
            $driverNode = Join-Path $publishedDriverRoot 'node/darwin-arm64/node'
            if (!(Test-Path $driverCli) -or !(Test-Path $driverNode)) {
              throw 'Published macOS Playwright driver tree is incomplete after pinned NuGet materialization.'
            }
            chmod +x $driverNode
          } else {
            dotnet publish SupraChat/SupraChat.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out
            dotnet publish SupraChat.Automation/SupraChat.Automation.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out
          }

          $sourceRevision = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceRevision)) {
            $sourceRevision = '${{ github.sha }}'
          }
          @{
            schema = 'suprachat-build-info/v1'
            source_revision = $sourceRevision
            workflow_run_id = '${{ github.run_id }}'
            workflow_run_attempt = '${{ github.run_attempt }}'
            runtime_identifier = '${{ matrix.rid }}'
            built_at_utc = [DateTime]::UtcNow.ToString('O', [Globalization.CultureInfo]::InvariantCulture)
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $out 'build-info.json')

      - name: Bundle pinned Playwright Chromium runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out/${{ matrix.rid }}'
          $browserRoot = Join-Path $root 'runtime/browser'
          New-Item -ItemType Directory -Force -Path $browserRoot | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserRoot

          # Prefer a Playwright launcher that still has Microsoft.Playwright.dll
          # beside it. macOS single-file publish intentionally embeds that assembly,
          # so browser acquisition must run from the ordinary Release build output.
          $playwrightScript = @(
            Get-ChildItem $root -Recurse -File -Filter 'playwright.ps1' -ErrorAction SilentlyContinue
            Get-ChildItem (Join-Path $PWD 'SupraChat/bin/Release') -Recurse -File -Filter 'playwright.ps1' -ErrorAction SilentlyContinue
          ) | Where-Object {
            Test-Path (Join-Path $_.Directory.FullName 'Microsoft.Playwright.dll')
          } | Select-Object -First 1
          if (-not $playwrightScript) {
            throw 'A Playwright installer script with adjacent Microsoft.Playwright.dll was not found.'
          }

          & $playwrightScript.FullName install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium install failed with $LASTEXITCODE" }

          $browserFiles = @(Get-ChildItem $browserRoot -Recurse -File -ErrorAction SilentlyContinue)
          if ($browserFiles.Count -eq 0) { throw 'Bundled browser runtime is empty.' }

          @{
            schema = 'suprachat-bundled-browser/v1'
            provider = 'Microsoft.Playwright'
            playwright_version = '1.63.0'
            browser = 'chromium'
            browser_files = $browserFiles.Count
            ephemeral_context_default = $true
            semantic_snapshot = 'aria-ai'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $browserRoot 'runtime.json')

      - name: Package human/automation/agent/accessibility contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $docs = Join-Path $PWD 'out/${{ matrix.rid }}/docs'
          New-Item -ItemType Directory -Force -Path $docs | Out-Null
          Copy-Item README.md $docs/
          Copy-Item AUDIENCES.md $docs/
          Copy-Item ACCESSIBILITY.md $docs/
          Copy-Item CAPABILITIES.md $docs/
          Copy-Item PARITY.md $docs/

      - name: Bundle pinned open-source Codex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = '${{ matrix.codex_asset }}'
          $expected = '${{ matrix.codex_sha256 }}'
          $url = "https://github.com/openai/codex/releases/download/$env:CODEX_TAG/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP $asset
          $runtime = Join-Path $PWD 'out/${{ matrix.rid }}/runtime/codex'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $tmp
          $actual = (Get-FileHash -Algorithm SHA256 -Path $tmp).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Codex asset digest mismatch: expected=$expected actual=$actual"
          }

          if ('${{ matrix.codex_archive }}' -eq 'true') {
            $extract = Join-Path $env:RUNNER_TEMP "codex-extract-${{ matrix.rid }}"
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            tar -xzf $tmp -C $extract
            if ($LASTEXITCODE -ne 0) { throw 'Failed to extract Codex runtime archive.' }

            $candidate = Get-ChildItem $extract -Recurse -File |
              Where-Object { $_.Name -eq 'codex' -or $_.Name -like 'codex-*' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if (-not $candidate) { throw 'Codex executable was not found in archive.' }
            Copy-Item $candidate.FullName (Join-Path $runtime 'codex')
            if ($IsLinux -or $IsMacOS) { chmod +x (Join-Path $runtime 'codex') }
          } else {
            Copy-Item $tmp (Join-Path $runtime 'codex.exe')
          }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/openai/codex/$env:CODEX_TAG/LICENSE" -OutFile (Join-Path $runtime 'LICENSE.openai-codex')

          @{
            schema = 'suprachat-bundled-codex/v1'
            version = $env:CODEX_VERSION
            tag = $env:CODEX_TAG
            source_asset = $asset
            source_sha256 = $actual
            license = 'Apache-2.0'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $runtime 'runtime.json')

      - name: Verify bundled Codex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'out/${{ matrix.rid }}/runtime/codex'
          $exe = if ($IsWindows) { Join-Path $runtime 'codex.exe' } else { Join-Path $runtime 'codex' }
          if (!(Test-Path $exe)) { throw "Bundled Codex executable missing: $exe" }
          if (!(Test-Path (Join-Path $runtime 'LICENSE.openai-codex'))) { throw 'Codex license missing.' }
          if (!(Test-Path (Join-Path $runtime 'runtime.json'))) { throw 'Codex runtime receipt missing.' }

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex --version failed with $LASTEXITCODE" }

      - name: Smoke packaged automation and agent shells
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out/${{ matrix.rid }}'
          $cli = if ($IsWindows) { Join-Path $root 'SupraChat.Automation.exe' } else { Join-Path $root 'SupraChat.Automation' }
          if (!(Test-Path $cli)) { throw "Packaged automation shell missing: $cli" }
          foreach ($docName in @('README.md','AUDIENCES.md','ACCESSIBILITY.md','CAPABILITIES.md','PARITY.md')) {
            if (!(Test-Path (Join-Path $root "docs/$docName"))) {
              throw "Packaged contract document missing: $docName"
            }
          }

          $cap = & $cli capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Packaged automation capabilities failed.' }
          $capDoc = $cap | ConvertFrom-Json
          if (-not $capDoc.ok -or -not $capDoc.value.audiences.automation.supported) {
            throw 'Packaged automation capability contract failed.'
          }

          $packagedDiagnostics = & $cli diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Packaged diagnostics command failed.' }
          $packagedDiagnosticsDoc = $packagedDiagnostics | ConvertFrom-Json
          if (-not $packagedDiagnosticsDoc.ok -or
              $packagedDiagnosticsDoc.value.source_revision.Length -ne 40 -or
              [string]::IsNullOrWhiteSpace($packagedDiagnosticsDoc.value.workflow_run_id) -or
              $packagedDiagnosticsDoc.value.runtime_identifier -ne '${{ matrix.rid }}') {
            throw 'Packaged build provenance/diagnostics contract failed.'
          }
          foreach ($method in @('realtime/voices','remote/status','remote/enable','remote/disable','remote/pairing/start','remote/pairing/status','remote/clients/list','remote/clients/revoke','plugins/list','permissions/profiles','apps/list','sandbox/readiness','screen/status','screen/capture','browser/status','browser/snapshot')) {
            if ($capDoc.value.machine_methods -notcontains $method) {
              throw "Semantic machine method missing from capabilities: $method"
            }
          }

          $remoteNoConfirm = & $cli remote-enable 2>$null
          $remoteNoConfirmExit = $LASTEXITCODE
          if ($remoteNoConfirmExit -ne 2) {
            throw "remote-enable without confirmation must exit 2; got $remoteNoConfirmExit"
          }
          $remoteNoConfirmDoc = $remoteNoConfirm | ConvertFrom-Json
          if ($remoteNoConfirmDoc.error.code -ne 'CONFIRMATION_REQUIRED') {
            throw 'remote-enable did not preserve explicit confirmation boundary.'
          }

          $remoteConfirmed = & $cli remote-enable --confirm 2>$null
          $remoteConfirmedExit = $LASTEXITCODE
          if ($remoteConfirmedExit -ne 3) {
            throw "confirmed remote-enable on clean runner must stop at AUTH_REQUIRED exit 3; got $remoteConfirmedExit"
          }
          $remoteConfirmedDoc = $remoteConfirmed | ConvertFrom-Json
          if ($remoteConfirmedDoc.error.code -ne 'AUTH_REQUIRED') {
            throw 'confirmed remote-enable did not stop at human authorization boundary.'
          }

          $screenStatus = & $cli screen-status
          if ($LASTEXITCODE -ne 0) { throw 'Packaged screen-status failed.' }
          $screenStatusDoc = $screenStatus | ConvertFrom-Json
          if (-not $screenStatusDoc.ok -or $screenStatusDoc.value.schema -ne 'suprachat-screen-capture/v1' -or -not $screenStatusDoc.value.requires_explicit_invocation) {
            throw 'Packaged screen-capture descriptor contract failed.'
          }

          foreach ($command in @('voices','remote-status','plugins','permission-profiles','apps','sandbox-readiness')) {
            $probe = & $cli $command 2>$null
            $probeExit = $LASTEXITCODE
            if ($probeExit -ne 3) {
              throw "Expected $command to stop at AUTH_REQUIRED with exit 3 on clean runner; got $probeExit"
            }
            $probeDoc = $probe | ConvertFrom-Json
            if ($probeDoc.ok -ne $false -or $probeDoc.error.code -ne 'AUTH_REQUIRED') {
              throw "Semantic command did not preserve human authorization boundary: $command"
            }
          }

          $browserStatus = & $cli browser-status
          if ($LASTEXITCODE -ne 0) { throw 'Packaged browser-status failed.' }
          $browserStatusDoc = $browserStatus | ConvertFrom-Json
          if (-not $browserStatusDoc.ok -or -not $browserStatusDoc.value.browser_directory_present -or -not $browserStatusDoc.value.accessibility_snapshot_supported) {
            throw 'Bundled browser runtime status contract failed.'
          }

          $browserSnapshot = & $cli browser-snapshot --url 'https://example.com/' 2>&1
          $browserSnapshotExit = $LASTEXITCODE
          if ($browserSnapshotExit -ne 0) {
            Write-Host 'Packaged browser-snapshot failure payload:'
            $browserSnapshot | ForEach-Object { Write-Host $_ }
            throw "Packaged browser-snapshot failed with exit $browserSnapshotExit."
          }
          $browserSnapshotDoc = $browserSnapshot | ConvertFrom-Json
          if (-not $browserSnapshotDoc.ok -or $browserSnapshotDoc.value.url -notlike 'https://example.com*' -or [string]::IsNullOrWhiteSpace($browserSnapshotDoc.value.aria_snapshot)) {
            throw 'Bundled browser semantic snapshot contract failed.'
          }

          $access = & $cli accessibility
          if ($LASTEXITCODE -ne 0) { throw 'Packaged accessibility command failed.' }
          $accessDoc = $access | ConvertFrom-Json
          if (-not $accessDoc.ok -or -not $accessDoc.value.human.keyboard_only -or -not $accessDoc.value.human.screen_reader_semantics) {
            throw 'Packaged accessibility contract failed.'
          }

          $parity = & $cli parity
          if ($LASTEXITCODE -ne 0) { throw 'Packaged audience parity command failed.' }
          $parityDoc = $parity | ConvertFrom-Json
          if (-not $parityDoc.ok -or $parityDoc.value.schema -ne 'suprachat-audience-parity/v1') {
            throw 'Packaged audience parity contract failed.'
          }
          foreach ($feature in $parityDoc.value.features) {
            foreach ($audience in @('human','accessible_human','automation','agent')) {
              if (-not $feature.access.$audience) { throw "Parity audience state missing: $($feature.id)/$audience" }
            }
            foreach ($platform in @('windows','macos','linux')) {
              if (-not $feature.platforms.$platform) { throw "Parity platform state missing: $($feature.id)/$platform" }
            }
            if (-not $feature.human_boundary) { throw "Parity human boundary missing: $($feature.id)" }
          }

          $catalog = & $cli catalog
          if ($LASTEXITCODE -ne 0) { throw 'Packaged automation catalog failed.' }
          $catalogDoc = $catalog | ConvertFrom-Json
          if ($catalogDoc.value.codex.packaged_runtime.counts.total -ne 263) { throw 'Packaged Codex catalog missing/stale.' }
          if ($catalogDoc.value.codex.upstream_frontier.counts.total -ne 266) { throw 'Codex frontier catalog missing/stale.' }

          $request = '{"jsonrpc":"2.0","id":"ci","method":"doctor/read"}'
          $rpc = $request | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent stdio failed.' }
          $rpcDoc = ($rpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($rpcDoc.id -ne 'ci' -or -not $rpcDoc.result.schema) {
            throw 'Packaged agent JSON-RPC contract failed.'
          }

          $accessRequest = '{"jsonrpc":"2.0","id":"a11y","method":"accessibility/read"}'
          $accessRpc = $accessRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent accessibility/read failed.' }
          $accessRpcDoc = ($accessRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($accessRpcDoc.id -ne 'a11y' -or -not $accessRpcDoc.result.human.screen_reader_semantics) {
            throw 'Packaged agent accessibility contract failed.'
          }

          $browserStatusRequest = '{"jsonrpc":"2.0","id":"browser-status","method":"browser/status"}'
          $browserStatusRpc = $browserStatusRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent browser/status failed.' }
          $browserStatusRpcDoc = ($browserStatusRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($browserStatusRpcDoc.id -ne 'browser-status' -or -not $browserStatusRpcDoc.result.browser_directory_present) {
            throw 'Packaged agent browser/status contract failed.'
          }

          $browserRequest = '{"jsonrpc":"2.0","id":"browser","method":"browser/snapshot","params":{"url":"https://example.com/"}}'
          $browserRpc = $browserRequest | & $cli stdio 2>&1
          $browserRpcExit = $LASTEXITCODE
          if ($browserRpcExit -ne 0) {
            Write-Host 'Packaged agent browser/snapshot failure payload:'
            $browserRpc | ForEach-Object { Write-Host $_ }
            throw "Packaged agent browser/snapshot failed with exit $browserRpcExit."
          }
          $browserRpcDoc = ($browserRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($browserRpcDoc.id -ne 'browser' -or [string]::IsNullOrWhiteSpace($browserRpcDoc.result.aria_snapshot)) {
            throw 'Packaged agent browser semantic snapshot contract failed.'
          }

          $parityRequest = '{"jsonrpc":"2.0","id":"parity","method":"parity/read"}'
          $parityRpc = $parityRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent parity/read failed.' }
          $parityRpcDoc = ($parityRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($parityRpcDoc.id -ne 'parity' -or $parityRpcDoc.result.schema -ne 'suprachat-audience-parity/v1') {
            throw 'Packaged agent parity contract failed.'
          }

          $remoteNoConfirmRequest = '{"jsonrpc":"2.0","id":"remote-confirm","method":"remote/enable","params":{}}'
          $remoteNoConfirmRpc = $remoteNoConfirmRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Agent remote confirmation probe failed.' }
          $remoteNoConfirmRpcDoc = ($remoteNoConfirmRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($remoteNoConfirmRpcDoc.error.data.type -ne 'CONFIRMATION_REQUIRED') {
            throw 'Agent remote/enable did not require explicit confirmation.'
          }

          $remoteConfirmedRequest = '{"jsonrpc":"2.0","id":"remote-auth","method":"remote/enable","params":{"confirm":true}}'
          $remoteConfirmedRpc = $remoteConfirmedRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Agent confirmed remote authorization probe failed.' }
          $remoteConfirmedRpcDoc = ($remoteConfirmedRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($remoteConfirmedRpcDoc.error.data.type -ne 'AUTH_REQUIRED') {
            throw 'Agent confirmed remote/enable did not stop at human authorization boundary.'
          }

          $screenRequest = '{"jsonrpc":"2.0","id":"screen","method":"screen/status"}'
          $screenRpc = $screenRequest | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent screen/status failed.' }
          $screenRpcDoc = ($screenRpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($screenRpcDoc.id -ne 'screen' -or $screenRpcDoc.result.schema -ne 'suprachat-screen-capture/v1' -or -not $screenRpcDoc.result.requires_explicit_invocation) {
            throw 'Packaged agent screen/status contract failed.'
          }


          foreach ($method in @('realtime/voices','remote/status','plugins/list','permissions/profiles','apps/list','sandbox/readiness')) {
            $semanticRequest = @{ jsonrpc='2.0'; id=$method; method=$method } | ConvertTo-Json -Compress
            $semanticRpc = $semanticRequest | & $cli stdio 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Agent stdio failed for semantic method: $method" }
            $semanticDoc = ($semanticRpc | Select-Object -Last 1) | ConvertFrom-Json
            if ($semanticDoc.id -ne $method -or $semanticDoc.error.data.type -ne 'AUTH_REQUIRED') {
              throw "Agent semantic method did not preserve AUTH_REQUIRED boundary: $method"
            }
          }

      - name: Repeat packaged runtime causal reps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out/${{ matrix.rid }}'
          $cli = if ($IsWindows) { Join-Path $root 'SupraChat.Automation.exe' } else { Join-Path $root 'SupraChat.Automation' }

          foreach ($rep in 1..3) {
            Write-Host "Causal runtime rep $rep/3 on ${{ matrix.os }} / ${{ matrix.rid }}"

            $doctor = & $cli doctor
            if ($LASTEXITCODE -ne 0) { throw "doctor failed on rep $rep" }
            $doctorDoc = $doctor | ConvertFrom-Json
            if (-not $doctorDoc.ok) { throw "doctor contract failed on rep $rep" }

            $diag = & $cli diagnostics
            if ($LASTEXITCODE -ne 0) { throw "diagnostics failed on rep $rep" }
            $diagDoc = $diag | ConvertFrom-Json
            if (-not $diagDoc.ok -or $diagDoc.value.trace_id.Length -ne 32) {
              throw "diagnostics trace contract failed on rep $rep"
            }
            if ($diagDoc.value.contains_prompts -or
                $diagDoc.value.contains_outputs -or
                $diagDoc.value.contains_token_material) {
              throw "diagnostics privacy contract failed on rep $rep"
            }

            $zip = Join-Path $env:RUNNER_TEMP "suprachat-${{ matrix.rid }}-rep-$rep.zip"
            $export = & $cli diagnostics-export --output $zip
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
              throw "diagnostics export failed on rep $rep"
            }

            $browser = & $cli browser-snapshot --url 'https://example.com/' 2>&1
            $browserExit = $LASTEXITCODE
            if ($browserExit -ne 0) {
              Write-Host ("browser-snapshot output for rep {0}:" -f $rep)
              $browser | ForEach-Object { Write-Host $_ }
              throw "browser-snapshot failed on rep $rep"
            }
            $browserDoc = $browser | ConvertFrom-Json
            if (-not $browserDoc.ok -or [string]::IsNullOrWhiteSpace($browserDoc.value.aria_snapshot)) {
              throw "browser semantic snapshot contract failed on rep $rep"
            }

            $rpcRequest = '{"jsonrpc":"2.0","id":"rep","method":"diagnostics/read"}'
            $rpc = $rpcRequest | & $cli stdio 2>&1
            if ($LASTEXITCODE -ne 0) { throw "diagnostics/read JSON-RPC failed on rep $rep" }
            $rpcDoc = ($rpc | Select-Object -Last 1) | ConvertFrom-Json
            if ($rpcDoc.id -ne 'rep' -or $rpcDoc.result.trace_id.Length -ne 32) {
              throw "diagnostics/read JSON-RPC contract failed on rep $rep"
            }

            $remote = & $cli remote-enable 2>$null
            if ($LASTEXITCODE -ne 2) { throw "confirmation boundary failed on rep $rep" }
            $remoteDoc = $remote | ConvertFrom-Json
            if ($remoteDoc.error.code -ne 'CONFIRMATION_REQUIRED') {
              throw "confirmation error contract failed on rep $rep"
            }

            $remoteConfirmed = & $cli remote-enable --confirm 2>$null
            if ($LASTEXITCODE -ne 3) { throw "authorization boundary failed on rep $rep" }
            $remoteConfirmedDoc = $remoteConfirmed | ConvertFrom-Json
            if ($remoteConfirmedDoc.error.code -ne 'AUTH_REQUIRED') {
              throw "authorization error contract failed on rep $rep"
            }

            # AUTH_REQUIRED is the expected native exit for this negative control.
            # Clear the native exit state so pwsh does not report the successful
            # qualification step itself as exit 3 after the final rep.
            $global:LASTEXITCODE = 0
          }
          Write-Host 'Three packaged-runtime causal reps PASS.'

      - name: Stage and smoke Linux per-user install
