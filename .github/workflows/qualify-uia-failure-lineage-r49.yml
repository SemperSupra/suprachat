name: R49 Windows UIA Failure Lineage Critic
on:
  pull_request:
    paths:
      - 'tools/ci-failure-lineage/**'
      - '.github/workflows/qualify-uia-failure-lineage-r49.yml'
permissions:
  contents: read
jobs:
  exact-head-failure-lineage:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate immutable Windows exit-70 observations and negative mutations
        run: |
          python tools/ci-failure-lineage/test_uia.py
          python tools/ci-failure-lineage/classify_uia.py tools/ci-failure-lineage/fixtures/three_public_heads.json
