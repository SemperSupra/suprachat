name: Qualify S0 shared-session ledger invariants

on:
  pull_request:
    paths:
      - 'SupraChat.ContractTests/**'
      - 'SupraChat/Core/SharedSession*.cs'
      - '.github/workflows/qualify-s0-ledger-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-contract:
    name: ledger-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run exact-head synthetic S0 CAS, replay, revocation and recovery contracts
        run: dotnet run --project SupraChat.ContractTests/SupraChat.ContractTests.csproj -c Release
