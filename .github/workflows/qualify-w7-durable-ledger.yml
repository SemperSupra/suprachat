name: Qualify W7 SQLite durable shared-session RDTE
on:
  pull_request:
    paths:
      - 'SupraChat.DurableRdte/**'
      - 'tools/qualify-w7-durable-ledger.py'
      - '.github/workflows/qualify-w7-durable-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-crash:
    name: W7 durable crash recovery ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated SQLite durability experiment
        run: dotnet build SupraChat.DurableRdte/SupraChat.DurableRdte.csproj -c Release
      - name: Exercise 100 crash/restart reps and immutable first outcomes
        run: python tools/qualify-w7-durable-ledger.py SupraChat.DurableRdte/bin/Release/net10.0/SupraChat.DurableRdte.dll
      - name: Confirm no provider or network authority in durability experiment
        shell: pwsh
        run: |
          $source = Get-Content -Raw 'SupraChat.DurableRdte/DurableLedger.cs'
          foreach ($term in @('HttpClient', 'Process.Start', 'WebSocket', 'AccessToken', 'ChatGptControlContract')) {
            if ($source.Contains($term)) { throw "Unexpected provider/credential code in W7 RDTE: $term" }
          }
          Write-Host 'W7 no-provider source guard PASS'
