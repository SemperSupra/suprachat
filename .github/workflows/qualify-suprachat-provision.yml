name: Qualify SupraChat owned provisioning plan (public synthetic)
on:
  pull_request:
    paths:
      - 'tools/suprachat-provision/**'
      - 'plugins/suprachat/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/qualify-suprachat-provision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suprachat-provision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/suprachat-provision
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Vet and repeat first-failure tests
        run: |
          set -euo pipefail
          go vet ./...
          go test -shuffle=on -count=5 -timeout=4m ./...
      - name: Concurrency/race detector
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count=2 -timeout=4m ./...
      - name: Dry-run CLI and evidence assertions
        run: |
          set -euo pipefail
          mkdir -p evidence
          go run ./cmd/plan --request fixtures/install.json > evidence/install.json
          go run ./cmd/plan --request fixtures/uninstall.json > evidence/uninstall.json
          python3 -c 'import json;d=json.load(open("evidence/install.json"));assert d["dry_run"] and not d["changes_applied"] and not d["chatgpt_connected"];assert any(x["operation"]=="operator_register_chatgpt_plugin" for x in d["steps"])'
          python3 -c 'import json;d=json.load(open("evidence/uninstall.json"));assert d["dry_run"] and not d["changes_applied"];assert any(x["operation"]=="defer_tunnel_delete" for x in d["steps"]);assert any(x["operation"]=="stop_owned_runtime" for x in d["steps"])'
          echo QUALIFIED_OWNER_SCOPED_REVERSIBLE_PLAN synthetic_only=true
      - name: Upload safe receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suprachat-owned-plan-${{ matrix.os }}
          path: tools/suprachat-provision/evidence/*.json
          retention-days: 7
          if-no-files-found: error
