name: Qualify single-authority ledger workbench projection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Bounded pure projection tests
        run: dotnet run --project SupraChat.LedgerProjectionTests/SupraChat.LedgerProjectionTests.csproj -c Release
