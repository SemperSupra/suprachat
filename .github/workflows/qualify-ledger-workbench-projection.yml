name: Qualify single-authority ledger workbench projection
on:
  pull_request:
  workflow_dispatch:
# Superseded revisions of one PR must not fan out costly cross-platform
# runs. Manual workflow_dispatch reps remain independently observable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  projection-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Bounded pure projection tests
        run: dotnet run --project SupraChat.LedgerProjectionTests/SupraChat.LedgerProjectionTests.csproj -c Release
