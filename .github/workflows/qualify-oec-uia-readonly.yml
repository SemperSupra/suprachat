name: Qualify OEC Native Windows UIA Read-Only Probe
on:
  pull_request:
    paths:
      - 'tools/oec-uia-readonly/**'
      - '.github/workflows/qualify-oec-uia-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oec-uia-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-synthetic-uia:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Static PS 5.1 parse and unsafe-process admission refusal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'tools/oec-uia-readonly/Inspect-SupraChatUIAReadOnly.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'UIA_PS51_SCRIPT_PARSE_FAILED' }
          $self = $PID
          $denied = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ProcessId $self -Samples 1 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $denied -notmatch 'REFUSED_NON_SYNTHETIC_PROCESS') {
            throw 'UIA_WRONG_PROCESS_NEGATIVE_FAILED'
          }
          Write-Host 'QUALIFIED_UIA_PS51_PARSE_AND_NONFIXTURE_REFUSAL'
      - name: Build real unmodified SupraChat Windows app fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish SupraChat/SupraChat.csproj -c Release -r win-x64 --self-contained false -o out/oec-uia-fixture
          if ($LASTEXITCODE -ne 0) { throw 'UIA_FIXTURE_BUILD_FAILED' }
          if (!(Test-Path out/oec-uia-fixture/SupraChat.exe)) { throw 'UIA_FIXTURE_EXE_MISSING' }
      - name: Observe real Windows native UIA provider in disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'tools/oec-uia-readonly/Inspect-SupraChatUIAReadOnly.ps1'
          $exe = Join-Path $PWD 'out/oec-uia-fixture/SupraChat.exe'
          $out = Join-Path $PWD 'tools/oec-uia-readonly/evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Never reuse a developer profile or enable web/browser authentication.
          $env:SUPRACHAT_INSTALL_TRACE_ID = [Guid]::NewGuid().ToString('N')
          $env:SUPRACHAT_INSTALL_SESSION_ID = [Guid]::NewGuid().ToString('N')
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { throw 'UIA_FIXTURE_EARLY_EXIT' }
            $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ProcessId $app.Id -Samples 10 -IntervalMs 750
            if ($LASTEXITCODE -ne 0) { throw 'UIA_PS51_REAL_PROVIDER_EXECUTION_FAILED' }
            $receipt = ($raw | Out-String).Trim() | ConvertFrom-Json
            if ($receipt.schema -ne 'suprachat-uia-readonly-diagnostic/v2' -or
                $receipt.evidence_class -ne 'PUBLIC_WINDOWS_SYNTHETIC_OBSERVATION' -or
                $receipt.sample_count -ne 10 -or
                $receipt.read_only -ne $true -or
                $receipt.content_or_credentials_captured -ne $false) {
              throw 'UIA_NATIVE_RECEIPT_CONTRACT_FAILED'
            }
            # Strict evidence field whitelist. No window names, text or process ID.
            $topKeys=@('schema','evidence_class','samples','sample_count',
              'elapsed_total_ms','result_class','root_observed',
              'empty_descendants_after_root','tab_observed','read_only',
              'content_or_credentials_captured')
            $sampleKeys=@('sample','elapsed_ms','process_alive','handle_nonzero',
              'root_present','root_id_matches','root_process_matches',
              'root_enabled','root_offscreen','direct_children','descendants',
              'target_matches','tree_truncated','provider_error_class')
            if (@($receipt.PSObject.Properties.Name | Where-Object { $_ -notin $topKeys }).Count -gt 0) {
              throw 'UIA_UNAPPROVED_TOP_LEVEL_EVIDENCE_FIELD'
            }
            foreach ($sample in $receipt.samples) {
              if (@($sample.PSObject.Properties.Name | Where-Object { $_ -notin $sampleKeys }).Count -gt 0) {
                throw 'UIA_UNAPPROVED_SAMPLE_EVIDENCE_FIELD'
              }
            }
            $receipt | ConvertTo-Json -Depth 5 -Compress |
              Set-Content -LiteralPath (Join-Path $out 'native-uia-readonly.json') -Encoding UTF8
            Write-Host ('EXECUTED_REAL_WINDOWS_UIA_PROVIDER result_class=' + $receipt.result_class +
              ' root_observed=' + $receipt.root_observed +
              ' tab_observed=' + $receipt.tab_observed +
              ' samples=' + $receipt.sample_count)
            # Observation != application acceptance. Even a successful diagnostic
            # is not proof that the full protected W1/W2 UIA smoke passes.
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload sanitized UIA provider observation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-windows-uia-readonly-evidence
          path: tools/oec-uia-readonly/evidence/native-uia-readonly.json
          if-no-files-found: ignore
          retention-days: 7
