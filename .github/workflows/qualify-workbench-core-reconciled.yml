name: Reconcile pure workbench contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbench-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Source-only session and transfer invariants
        run: dotnet run --project SupraChat.WorkbenchContractTests/SupraChat.WorkbenchContractTests.csproj -c Release
      # No browser, account, command execution, local worktree, credential, or profile.
